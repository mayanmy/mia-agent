services:
  redis:
    image: redis:7.4-alpine
    container_name: mia-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - mia_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mia-postgres
    environment:
      POSTGRES_DB: mia
      POSTGRES_USER: mia
      POSTGRES_PASSWORD: mia
    ports:
      - "5432:5432"
    volumes:
      - mia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mia -d mia"]
      interval: 10s
      timeout: 5s
      retries: 5

  ops-demo-api:
    build:
      context: ./examples/ops-demo-api
    container_name: mia-ops-demo-api
    ports:
      - "3100:3100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mia_postgres_data:
  mia_redis_data:
